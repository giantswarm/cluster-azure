{{- define "azureExternalDnsPrivateHelmValues" -}}
provider: azure-private-dns
clusterID: {{ include "resource.default.name" . }}
crd:
  install: false
domainFilters:
- {{ printf "%s.%s" (include "resource.default.name" .) .Values.global.connectivity.baseDomain | quote }}
txtOwnerId: giantswarm-io-external-dns
txtPrefix: {{ include "resource.default.name" . }}
extraVolumes:
- name: azure-config-file
  hostPath:
    path: /etc/kubernetes
extraVolumeMounts:
- name: azure-config-file
  mountPath: /etc/kubernetes
  readOnly: true
ciliumNetworkPolicy:
  enabled: true
{{- if (.Values.global.connectivity.proxy).enabled }}
env:
- name: HTTP_PROXY
  value: {{ .Values.global.connectivity.proxy.httpProxy | quote }}
- name: HTTPS_PROXY
  value: {{ .Values.global.connectivity.proxy.httpsProxy | quote }}
- name: NO_PROXY
  value: {{ include "cluster.connectivity.proxy.noProxy" (dict "global" .Values.global "providerIntegration" .Values.cluster.providerIntegration) | quote }}
{{- end }}
{{- end }}
{{- if eq .Values.global.connectivity.network.mode "private" -}}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: {{ include "resource.default.name" . }}-external-dns-private
  namespace: {{ .Release.Namespace }}
  annotations:
    cluster.giantswarm.io/description: {{ .Values.global.metadata.description | quote }}
  labels:
    cluster-apps-operator.giantswarm.io/watching: ""
    {{- include "labels.common" . | nindent 4 }}
spec:
  {{- $_ := set $ "appName" "external-dns" }}
  url: oci://gsoci.azurecr.io/charts/giantswarm/external-dns-app
  ref:
    tag: {{ include "cluster.app.version" . }}
  interval: 24h
  timeout: 60s
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "resource.default.name" . }}-external-dns-private
  namespace: {{ .Release.Namespace }}
  annotations:
    cluster.giantswarm.io/description: {{ .Values.global.metadata.description | quote }}
  labels:
    cluster-apps-operator.giantswarm.io/watching: ""
    {{- if .Values.global.metadata.servicePriority }}
    giantswarm.io/service-priority: {{ .Values.global.metadata.servicePriority }}
    {{- end }}
    {{- include "labels.common" . | nindent 4 }}
spec:
  releaseName: external-dns-private
  targetNamespace: kube-system
  storageNamespace: kube-system
  chartRef:
    kind: OCIRepository
    name: {{ include "resource.default.name" . }}-external-dns-private
  kubeConfig:
    secretRef:
      name: {{ include "resource.default.name" . }}-kubeconfig
  dependsOn:
  - name: {{ include "resource.default.name" . }}-cilium
    namespace: {{ .Release.Namespace }}
  - name: {{ include "resource.default.name" . }}-prometheus-operator-crd
    namespace: {{ .Release.Namespace }}
  - name: {{ include "resource.default.name" . }}-vertical-pod-autoscaler-crd
    namespace: {{ .Release.Namespace }}
  driftDetection:
    mode: enabled
  interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  {{- $externalDnsPrivateHelmValues := include "azureExternalDnsPrivateHelmValues" . | fromYaml }}
  {{- $customExternalDnsPrivateHelmValues := .Values.global.apps.externalDnsPrivate.values }}
  {{- if $customExternalDnsPrivateHelmValues }}
  {{- $externalDnsPrivateHelmValues = merge (deepCopy $customExternalDnsPrivateHelmValues) $externalDnsPrivateHelmValues }}
  {{- end }}
  {{- if $externalDnsPrivateHelmValues }}
  values:
    {{- $externalDnsPrivateHelmValues | toYaml | nindent 4 }}
  {{- end }}
  {{- if .Values.global.apps.externalDnsPrivate.extraConfigs }}
  valuesFrom:
  {{- range $config := .Values.global.apps.externalDnsPrivate.extraConfigs }}
  - kind: {{ $config.kind }}
    name: {{ $config.name }}
    valuesKey: values
    optional: {{ $config.optional | default false }}
  {{- end }}
  {{- end }}
{{- end }}
